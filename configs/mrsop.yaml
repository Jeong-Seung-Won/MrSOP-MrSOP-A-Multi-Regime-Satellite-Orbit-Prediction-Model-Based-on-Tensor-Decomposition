data:
  train_csv: data/train.csv
  val_csv: data/val.csv
  test_csv: data/test.csv
  unit: km
  num_workers: 4
  prefetch_factor: 4
  look_back: 192
  horizon: 96
  stride: 15
  n_channels: 6
  sampling_temperature: 0.5
  windows_per_epoch: 500000
  val_windows: 50000
model:
  name: mrsop
  d_model: 512
  d_ff: 1024
  n_layers: 2
  n_scales: 3
  down_sampling_window: 2
  decomp_kernel: 25
  dropout: 0.1
  revin_eps: 1.0e-05
  revin_affine: false
  n_experts: 16
  moe_top_k: 2
  tt_rank: 32
  router_tau: 0.15
train:
  batch_size: 64
  grad_accum: 1
  epochs: 50
  lr: 0.0002
  weight_decay: 1.0e-05
  grad_clip: 1.0
  warmup_steps: 500
  seed: 42
  device: cuda
  amp: true
  log_every: 100
  val_every: 1
  ckpt_dir: checkpoints
  early_stop_patience: 0
  resume: false
exp_name: mrsop
